server:
  port: 8001

spring:
  application:
    name: auth-service

  datasource:
    url: jdbc:mysql://localhost:3306/brain_health?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: bh_user
    password: bh_pass_2024

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379
      password: redis_pass_2024
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:25}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}

brain-health:
  auth:
    reset-from: ${RESET_MAIL_FROM:no-reply@brainhealth.local}
    otp-encryption-key: ${OTP_ENCRYPTION_KEY:change-this-development-key-before-production}

logging:
  level:
    com.brainhealth: DEBUG
    root: INFO
